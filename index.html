<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일상 주역</title>
<meta name="description" content="엽전 세 닢으로 주역 괘를 얻고 일상의 말로 풀이합니다.">
<meta name="theme-color" content="#EBEFE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131816" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="일상 주역">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* Layout: one calm column like a folded 괘 card — 묻기 → 엽전 여섯 번 → 괘 읽기; 64괘 도감과 기록은 탭 */
:root {
  --paper: #EBEFE8;      /* celadon-tinged hanji */
  --surface: #F6F8F3;
  --ink: #1C2321;
  --ink-2: #384340;
  --line: #C6CFC6;
  --seal: #A6342A;       /* 인주 red: only for changing lines and the seal */
  --brass: #94763A;      /* 엽전 */
  --brass-2: #6E5626;
  --f-display: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131816; --surface: #1B211F; --ink: #E4E9E2; --ink-2: #C2CBC6;
    --line: #313A36; --seal: #E2725F; --brass: #C7A35A; --brass-2: #8F7438;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131816; --surface: #1B211F; --ink: #E4E9E2; --ink-2: #C2CBC6;
  --line: #313A36; --seal: #E2725F; --brass: #C7A35A; --brass-2: #8F7438;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.75; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; line-height: 1.3; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }

/* header */
.top { display: flex; align-items: center; gap: 14px; }
.seal { width: 46px; height: 46px; flex: none; display: grid; place-items: center; border: 2px solid var(--seal); color: var(--seal);
  font-family: var(--f-display); font-size: 30px; border-radius: 4px; transform: rotate(-4deg); }
.top h1 { font-size: 30px; }
.top p { color: var(--ink-2); font-size: 15.5px; }
nav { display: flex; gap: 4px; margin: 22px 0 20px; border-bottom: 1px solid var(--line); }
nav button { background: none; border: 0; padding: 10px 14px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

/* ask */
.ask { display: grid; gap: 12px; }
label.lb { font-size: 15px; letter-spacing: .06em; color: var(--ink-2); }
textarea { width: 100%; min-height: 64px; resize: vertical; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r);
  background: var(--surface); color: var(--ink); font: inherit; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; }
.pick > * { min-width: 0; }
.pk { font-size: 15px; color: var(--ink-2); }
.frame { font-size: 15.5px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.q .note { display: block; margin-top: 2px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 14px; font-size: 15.5px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* toss */
.toss { display: grid; grid-template-columns: 1fr 180px; gap: 28px; align-items: center; margin-top: 22px; padding: 22px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.toss > * { min-width: 0; }
.coins { display: flex; gap: 14px; }
.coin { width: 62px; height: 62px; border-radius: 50%; position: relative; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--brass) 60%, var(--surface)), var(--brass) 70%);
  border: 2px solid var(--brass-2); transition: transform .45s; }
.coin::after { content: ""; width: 16px; height: 16px; background: var(--surface); border: 2px solid var(--brass-2); }
.coin span { position: absolute; font-family: var(--f-display); font-size: 12px; font-weight: 700; color: var(--surface); }
.coin span:nth-child(1) { top: 3px; } .coin span:nth-child(2) { bottom: 3px; }
.coin span:nth-child(3) { left: 6px; } .coin span:nth-child(4) { right: 6px; }
.coin.back { background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--brass-2) 70%, var(--surface)), var(--brass-2) 75%); }
.coin.back span { opacity: 0; }
.coin.flip { transform: rotateY(540deg) translateY(-10px); }
.readout { margin-top: 14px; min-height: 28px; color: var(--ink-2); font-size: 15.5px; }
.readout b { color: var(--ink); font-weight: 700; font-family: var(--f-display); font-size: 18px; }
.readout .chg { color: var(--seal); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: var(--r); padding: 10px 18px; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
.build { display: grid; justify-items: center; gap: 8px; }
.build small { color: var(--ink-2); font-size: 14px; letter-spacing: .06em; }
.how { margin-top: 14px; font-size: 15px; color: var(--ink-2); }

/* hexagram lines: bottom line first, drawn upward */
.hex { display: flex; flex-direction: column-reverse; gap: var(--hg, 9px); width: var(--hw, 132px); }
.ln { display: flex; gap: calc(var(--hw, 132px) * .16); height: var(--hh, 12px); position: relative; }
.ln i { flex: 1; background: var(--ink); border-radius: 2px; }
.ln.yang { gap: 0; }
.ln.ch i { background: var(--seal); }
.ln.empty i { background: transparent; border: 1px dashed var(--line); }
.ln .mk { position: absolute; right: calc(-1 * var(--hh, 12px) - 10px); top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--seal); line-height: 1; }
.ln.new { animation: drop .35s ease-out; }
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.hex.sm { --hw: 46px; --hh: 5px; --hg: 4px; }
.hex.md { --hw: 84px; --hh: 8px; --hg: 6px; }

/* reading */
#result { margin-top: 30px; }
.reading { display: grid; gap: 22px; }
.q { font-size: 15.5px; color: var(--ink-2); border-left: 2px solid var(--line); padding-left: 12px; }
.headline { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; }
.headline > div { min-width: 0; }
.num { font-size: 15px; letter-spacing: .08em; color: var(--ink-2); }
.name { font-size: 34px; }
.name .hz { font-size: 22px; color: var(--ink-2); margin-left: 8px; }
.kw { display: inline-block; margin-top: 6px; font-size: 15.5px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; }
.tri { font-size: 15px; color: var(--ink-2); margin-top: 8px; }
.one { font-family: var(--f-display); font-weight: 600; font-size: 22px; }
.easy { max-width: 62ch; }
.answer { padding: 16px 18px; border: 1px solid var(--ink); border-radius: var(--r); display: grid; gap: 4px; }
.answer .lb { font-size: 15px; letter-spacing: .06em; color: var(--ink-2); }
.rows { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 92px 1fr; gap: 12px; }
.row dt { font-size: 15px; color: var(--ink-2); padding-top: 2px; }
.row dd { margin: 0; min-width: 0; }
.tip { display: flex; gap: 12px; align-items: baseline; }
.tip strong { font-weight: 700; font-family: var(--f-display); color: var(--seal); flex: none; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 15.5px; }
details[open] summary { margin-bottom: 12px; }
.sec { border-top: 1px solid var(--line); padding-top: 20px; display: grid; gap: 14px; }
.sec h3 { font-size: 20px; }
.rule { font-size: 15.5px; color: var(--ink-2); }
.keys { display: grid; gap: 10px; }
.key { display: grid; grid-template-columns: 56px 1fr; gap: 12px; }
.key b { font-weight: 700; color: var(--seal); font-family: var(--f-display); }
.yt { display: grid; gap: 2px; min-width: 0; }
.yt strong { font-weight: 700; }
.hz2 { font-family: var(--f-display); font-size: 14px; color: var(--ink-2); margin-left: 8px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; font-size: 15px; }
.flow .arrow { color: var(--seal); }
.flow .st { display: grid; gap: 2px; }
.flow .st small { font-size: 14px; color: var(--ink-2); }
.next { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: start; padding: 18px; background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); }
.next > div:not(.hex) { min-width: 0; display: grid; gap: 6px; }
.next .name { font-size: 24px; }
.note { font-size: 14px; color: var(--ink-2); }

/* 64 */
.search { width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); font: inherit; margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; text-align: left; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.card:hover { border-color: var(--ink-2); }
.card > div { min-width: 0; }
.card .n { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.card .nm { font-family: var(--f-display); font-weight: 700; font-size: 18px; line-height: 1.2; }
.card .k { font-size: 14px; color: var(--ink-2); }
.empty-msg { color: var(--ink-2); padding: 20px 0; }

/* hist */
.hist { display: grid; gap: 8px; }
.hrow { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.hrow > div { min-width: 0; }
.hrow .t { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.hrow .qq { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow .g { font-family: var(--f-display); font-weight: 600; font-size: 15px; white-space: nowrap; }

/* overlay */
.ov { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 50%, transparent); display: grid; place-items: center; z-index: 10;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel { background: var(--paper); border-radius: 10px; width: min(640px, 100%); max-height: 100%; overflow: auto; padding: 24px; position: relative; }
.close { position: absolute; top: 12px; right: 12px; background: none; border: 1px solid var(--line); border-radius: 50%; width: 34px; height: 34px; }

footer { margin-top: 48px; font-size: 14px; color: var(--ink-2); }

@media (max-width: 560px) {
  .toss { grid-template-columns: 1fr; padding: 18px; }
  .build { justify-items: start; }
  .headline { grid-template-columns: 1fr; gap: 16px; }
  .next { grid-template-columns: 1fr; }
  .coin { width: 54px; height: 54px; }
  .chips { gap: 6px; }
  .chip { padding: 4px 10px; font-size: 15px; }
  .pick { grid-template-columns: 36px 1fr; gap: 8px; }
  .name { font-size: 30px; }
}
@media (prefers-reduced-motion: reduce) {
  .coin, .coin.flip { transition: none; transform: none; }
  .ln.new { animation: none; }
}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="seal" aria-hidden="true">易</div>
    <div>
      <h1>일상 주역</h1>
      <p>엽전 세 닢을 여섯 번 던져 괘를 얻고, 오늘의 말로 읽습니다.</p>
    </div>
  </header>

  <nav role="tablist">
    <button role="tab" id="tab-ask" aria-selected="true" data-tab="ask">괘 보기</button>
    <button role="tab" id="tab-all" aria-selected="false" data-tab="all">64괘</button>
    <button role="tab" id="tab-hist" aria-selected="false" data-tab="hist">기록</button>
  </nav>

  <section id="view-ask">
    <div class="ask">
      <label class="lb" for="q">무엇이 궁금한가요?</label>
      <textarea id="q" placeholder="예) 이번 달에 이직 준비를 시작해도 될까?"></textarea>
      <div class="pick"><span class="pk">기간</span><div class="chips" id="periods" role="group" aria-label="기간"></div></div>
      <div class="pick"><span class="pk">분야</span><div class="chips" id="cats" role="group" aria-label="분야"></div></div>
    </div>

    <div class="toss">
      <div>
        <div class="coins" id="coins"></div>
        <div class="readout" id="readout">질문을 마음에 품고 엽전을 던지세요. 아래 효부터 위로 쌓입니다.</div>
        <div class="actions">
          <button class="btn" id="tossBtn">엽전 던지기 · 1/6</button>
          <button class="btn ghost" id="quickBtn">한 번에 여섯 번</button>
          <button class="btn ghost" id="resetBtn" hidden>새로 묻기</button>
        </div>
        <p class="how">앞면(글자)=3, 뒷면=2. 합이 7이면 양(—), 8이면 음(- -). 6과 9는 <span style="color:var(--seal)">변하는 효</span>로, 앞으로 반대로 바뀝니다.</p>
      </div>
      <div class="build">
        <div class="hex" id="build"></div>
        <small id="buildLabel">0 / 6 효</small>
      </div>
    </div>

    <div id="result"></div>
  </section>

  <section id="view-all" hidden>
    <input class="search" id="search" type="search" placeholder="이름·뜻으로 찾기 (예: 태, 기다림, 11)">
    <div class="grid" id="grid"></div>
  </section>

  <section id="view-hist" hidden>
    <div class="hist" id="hist"></div>
  </section>

  <footer>주역의 괘는 정답이 아니라 생각을 정리하는 거울입니다. 중요한 결정은 스스로의 판단과 함께 내리세요.</footer>
</div>

<div class="ov" id="ov" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-label="괘 풀이">
    <button class="close" id="closeOv" aria-label="닫기">✕</button>
    <div id="ovBody"></div>
  </div>
</div>

<script>
// [한자, 이름, 키워드, 한 줄, 쉬운 해석, 일·공부, 관계·연애, 돈, 오늘 해볼 일]
const D = [
["乾","건","강한 추진력","하늘처럼 쉬지 않고 움직일 때.","에너지가 가장 강한 괘입니다. 하고 싶은 일을 밀고 나갈 힘이 있어요. 다만 너무 앞서 나가면 혼자 남을 수 있으니 속도 조절이 필요합니다.","주도적으로 이끌어도 좋은 때. 계획을 세우고 바로 실행하세요.","적극적으로 표현하면 통합니다. 단, 상대의 속도도 배려하세요.","투자·확장에 유리하지만 과신은 금물입니다.","미뤄 둔 큰 일 하나를 오늘 시작하세요."],
["坤","곤","포용과 뒷받침","땅처럼 받아주고 키워줄 때.","앞에 나서기보다 따라가며 받쳐주는 것이 힘이 되는 시기입니다. 좋은 리더나 흐름을 따르면 결과가 좋아요. 고집보다 유연함이 이깁니다.","주도권보다 팀을 돕는 역할에서 인정받습니다.","들어주고 맞춰주는 태도가 관계를 깊게 합니다.","무리한 확장보다 꾸준히 모으는 쪽이 유리합니다.","누군가의 부탁 하나를 기꺼이 들어주세요."],
["屯","둔","시작의 진통","새싹이 언 땅을 뚫고 나오는 중.","새로운 시작이라 혼란스럽고 막히는 게 당연합니다. 서두르지 말고 도와줄 사람을 찾으세요. 이 고비를 넘기면 크게 자랍니다.","새 일 초반의 시행착오. 혼자 해결하려 하지 말고 조언을 구하세요.","시작 단계의 어색함. 천천히 신뢰를 쌓으세요.","초기 비용이 드는 때. 큰돈을 걸기엔 아직 이릅니다.","막힌 일을 작은 단계로 쪼개 첫 단계만 해보세요."],
["蒙","몽","배움이 필요함","안개 속, 아직 모르는 게 많다.","경험이 부족하거나 상황이 잘 안 보이는 때입니다. 아는 척보다 묻고 배우는 게 빠른 길이에요. 좋은 스승이나 자료를 찾으세요.","새로 배울 것이 있습니다. 선배나 전문가에게 물어보세요.","상대를 다 안다고 생각하지 마세요. 질문이 관계를 엽니다.","잘 모르는 투자는 피하세요. 공부가 먼저입니다.","궁금했던 것 하나를 오늘 제대로 찾아보세요."],
["需","수","때를 기다림","비구름은 모였지만 아직 비는 오지 않았다.","좋은 일이 오고 있지만 지금 억지로 당기면 안 됩니다. 잘 먹고 준비하며 기다리는 것이 정답이에요. 조급함이 가장 큰 적입니다.","결과나 답변을 기다리는 중이라면 재촉하지 마세요.","상대의 마음이 열릴 시간을 주세요.","타이밍을 기다리세요. 성급한 매수·매도는 손해입니다.","기다리는 동안 할 수 있는 준비 하나를 하세요."],
["訟","송","다툼과 갈등","하늘은 위로, 물은 아래로. 서로 엇갈린다.","의견 충돌이나 시비가 생기기 쉬운 때입니다. 이기려고 끝까지 가면 둘 다 손해를 봐요. 중간에 멈추고 제3자의 도움을 받는 게 현명합니다.","계약과 책임 소재를 분명히 하세요. 감정 싸움은 피하세요.","말다툼이 커지기 쉬워요. 옳고 그름보다 마음을 보세요.","법적 분쟁·보증·동업은 신중히.","오늘은 한 번 져주는 연습을 해보세요."],
["師","사","조직과 규율","땅속에 물이 모이듯 사람을 모아 이끈다.","혼자보다 여럿이 힘을 모아야 하는 일입니다. 규칙과 역할 분담이 분명해야 해요. 믿을 만한 리더가 중심을 잡으면 이깁니다.","팀 단위 일에 유리합니다. 역할과 마감을 명확히 정하세요.","가족과 친구의 지지가 힘이 됩니다.","계획적인 지출 관리가 필요해요. 예산을 세우세요.","할 일 목록에 우선순위를 매겨보세요."],
["比","비","가까이 함께함","물이 땅에 스며들 듯 친해진다.","사람들과 손잡을 때입니다. 마음 맞는 사람에게 먼저 다가가세요. 너무 망설이면 좋은 인연을 놓칩니다.","협업·제휴에 좋은 때. 먼저 연락하세요.","관계가 가까워집니다. 망설이지 말고 다가가세요.","믿을 만한 사람과의 협력이 이익이 됩니다.","연락이 뜸했던 사람에게 안부를 보내세요."],
["小畜","소축","작게 모으기","구름은 짙으나 비는 아직.","큰 성과보다 작은 것을 차곡차곡 쌓는 시기입니다. 일이 생각만큼 시원하게 풀리지 않아도 괜찮아요. 작은 준비가 나중에 힘이 됩니다.","디테일을 다듬는 시기. 큰 결정은 조금 미루세요.","작은 배려가 쌓여 마음이 움직입니다.","소액 저축과 절약에 좋은 때입니다.","오늘 커피값 한 번을 아껴 따로 모아보세요."],
["履","리","조심스럽게 밟기","호랑이 꼬리를 밟아도 물리지 않는다.","까다로운 사람이나 위험한 상황 앞에 있지만, 예의 바르고 조심스러우면 무사히 지나갑니다. 선을 지키는 태도가 나를 보호해요.","까다로운 상사나 고객 앞. 예의와 원칙을 지키세요.","상대의 민감한 부분을 건드리지 않도록 주의하세요.","위험한 투자는 원칙을 정하고 그 선을 지키세요.","말하기 전에 한 번 더 생각하세요."],
["泰","태","막힘없이 통함","하늘과 땅이 만나 모든 것이 통한다.","운이 잘 풀리는 좋은 때입니다. 사람과 사람, 위와 아래가 잘 통해요. 다만 좋은 때일수록 다음을 대비해 두세요.","소통이 잘 되고 일이 순조롭습니다. 적극 추진하세요.","마음이 잘 통하는 시기. 관계를 한 단계 발전시켜도 좋아요.","재물 흐름이 좋습니다. 일부는 꼭 저축해 두세요.","고마운 사람에게 감사를 표현하세요."],
["否","비","꽉 막힘","하늘과 땅이 등을 돌려 통하지 않는다.","소통이 막히고 노력해도 잘 안 풀리는 때입니다. 억지로 밀어붙이기보다 내실을 다지며 버티세요. 막힘은 영원하지 않습니다.","새로운 시도는 보류하고 기본기와 실력을 쌓으세요.","오해가 생기기 쉬워요. 무리한 대화보다 거리를 두고 기다리세요.","지출을 줄이고 현금을 지키세요.","오늘은 혼자 정리하며 쉬는 시간을 가지세요."],
["同人","동인","뜻을 같이함","넓은 들에서 사람들과 함께한다.","같은 목표를 가진 사람들과 모일 때 힘이 생깁니다. 끼리끼리보다 열린 마음으로 넓게 어울리세요. 공정하면 사람이 모입니다.","공동 프로젝트나 커뮤니티 활동에 좋은 때입니다.","취미나 가치관이 맞는 인연을 만날 수 있어요.","함께 하는 일이 이득입니다. 단, 돈 문제는 투명하게.","관심사가 같은 모임에 참여해 보세요."],
["大有","대유","크게 가짐","해가 하늘 높이 떠 모든 것을 비춘다.","가진 것이 많아지고 인정받는 시기입니다. 성과를 나누고 겸손하면 복이 오래 가요. 자랑은 운을 깎습니다.","성과가 드러나고 평가가 좋습니다.","매력이 돋보이는 때. 상대에게 너그러워지세요.","수입이 좋아질 수 있어요. 나눔도 잊지 마세요.","도와준 사람과 성과를 나누세요."],
["謙","겸","겸손","높은 산이 땅 아래로 몸을 낮춘다.","자신을 낮출수록 오히려 올라가는 때입니다. 실력이 있어도 드러내지 않으면 사람들이 알아봐 줘요. 64괘 중 가장 탈이 없는 괘로 꼽힙니다.","공을 남에게 돌리면 신뢰가 쌓입니다.","내 주장보다 상대를 높여주면 관계가 편해집니다.","과시성 소비를 줄이면 재물이 모입니다.","오늘 한 번, 칭찬을 남에게 돌려보세요."],
["豫","예","즐거운 준비","우레가 땅에서 울려 봄을 알린다.","기분 좋은 일이 생기고 사람들이 호응하는 때입니다. 미리 준비해 두면 기회를 잡아요. 다만 즐거움에 빠져 게을러지지 않도록.","발표·홍보·행사에 좋은 때. 사전 준비가 핵심입니다.","함께 즐기는 시간이 관계를 살립니다.","여가 지출이 늘 수 있으니 예산 안에서.","다가올 일정 하나를 미리 준비해 두세요."],
["隨","수","흐름을 따름","우레가 연못 아래에서 쉬듯 때를 따른다.","고집보다 흐름에 맞춰 움직이면 잘 풀리는 때입니다. 좋은 사람, 좋은 방향을 따르세요. 쉴 때 쉬는 것도 따르는 일입니다.","변화에 유연하게 맞추세요. 좋은 선배를 따르면 배웁니다.","상대의 리듬에 맞춰주면 자연스럽게 가까워집니다.","시장 흐름을 거스르지 마세요.","오늘은 계획을 고집하지 말고 흐름에 맡겨보세요."],
["蠱","고","묵은 문제 고치기","그릇 속 벌레, 오래 썩은 것을 고친다.","그동안 미뤄온 문제가 드러나는 때입니다. 피하지 말고 원인을 찾아 고치면 새로 시작할 수 있어요. 고치기 전에 충분히 살피고, 고친 뒤에 점검하세요.","오래된 업무 문제와 비효율을 정리할 때입니다.","쌓인 서운함을 꺼내 해결하면 관계가 새로워집니다.","묵은 빚, 안 쓰는 구독, 새는 돈을 정리하세요.","미뤄둔 정리 하나를 끝내세요."],
["臨","림","다가오는 기회","연못 위의 땅, 가까이 다가가 돌본다.","좋은 기운이 점점 커지는 때입니다. 적극적으로 다가가고 사람을 보살피세요. 좋은 시기는 영원하지 않으니 지금 움직이세요.","기회가 다가옵니다. 먼저 손 내밀고 후배를 잘 이끄세요.","관계가 무르익는 시기. 적극적으로 다가가세요.","상승 흐름입니다. 단, 정점이 있다는 걸 기억하세요.","미뤄둔 제안을 오늘 꺼내보세요."],
["觀","관","멀리 살펴봄","바람이 땅 위를 두루 지나며 살핀다.","움직이기보다 상황을 넓게 보고 관찰할 때입니다. 남을 보는 만큼 나 자신도 돌아보세요. 나의 태도를 누군가 지켜보고 있습니다.","결정 전에 정보를 모으고 흐름을 파악하세요.","상대를 판단하기보다 관찰하고 이해하세요.","공부하며 지켜보는 쪽이 이득입니다.","오늘 하루를 돌아보는 메모를 써보세요."],
["噬嗑","서합","깨물어 뚫음","입 안의 걸림돌을 깨물어 없앤다.","일을 막고 있는 걸림돌이 분명히 있습니다. 미적거리지 말고 단호하게 처리하세요. 규칙과 원칙을 분명히 하면 해결됩니다.","문제를 정면으로 다루세요. 기준과 규칙을 명확히.","애매한 문제는 분명히 이야기해야 풀립니다.","밀린 정산이나 받을 돈은 확실히 처리하세요.","계속 신경 쓰이던 문제 하나를 오늘 결론 내세요."],
["賁","비","꾸밈과 아름다움","산 아래 불, 노을처럼 아름답게 꾸민다.","겉모습과 분위기를 가꾸면 좋은 때입니다. 하지만 꾸밈은 내용이 받쳐줄 때 빛나요. 작은 일에는 좋고, 큰 결정은 본질을 보세요.","발표 자료나 포트폴리오를 다듬기에 좋습니다.","외모와 분위기 관리가 효과적. 진심도 함께 보여주세요.","겉보기에 혹하는 소비를 조심하세요.","책상이나 방 한 곳을 보기 좋게 정돈하세요."],
["剝","박","깎여 나감","산이 땅으로 무너져 내린다.","기반이 조금씩 깎이는 시기입니다. 새로 시작하기보다 지금 가진 것을 지키세요. 움직이지 않고 버티면 다시 회복할 때가 옵니다.","무리한 도전은 피하고 지키는 쪽으로.","관계에 금이 갈 수 있어요. 말을 아끼세요.","손실 가능성이 있습니다. 지출과 위험 자산을 줄이세요.","오늘은 새 일을 벌이지 말고 지키는 데 집중하세요."],
["復","복","다시 돌아옴","땅 아래 우레, 겨울 끝에 봄이 돌아온다.","바닥을 찍고 회복이 시작되는 때입니다. 원래의 좋은 습관과 마음으로 돌아가세요. 천천히, 꾸준히 하면 다시 살아납니다.","다시 도전하기 좋은 때. 기본으로 돌아가세요.","멀어졌던 사람과 다시 이어질 수 있어요.","회복 흐름입니다. 서두르지 말고 조금씩.","그만뒀던 좋은 습관 하나를 다시 시작하세요."],
["無妄","무망","꾸밈없는 진실","하늘 아래 우레, 자연스럽게 움직인다.","꼼수 없이 정직하게 하면 잘 됩니다. 반대로 욕심으로 계산하면 뜻밖의 일을 당해요. 예상 못 한 일이 생겨도 담담히 받아들이세요.","원칙대로 정직하게. 요행을 바라지 마세요.","계산 없는 진심이 통합니다.","투기와 한탕은 피하세요. 뜻밖의 지출에 대비하세요.","오늘은 있는 그대로 솔직하게 말해보세요."],
["大畜","대축","크게 쌓아둠","산 속에 하늘을 품듯 힘을 모은다.","실력과 자원을 크게 쌓는 때입니다. 바로 쓰기보다 잘 모아두면 나중에 큰일을 할 수 있어요. 배우고 익히기에 아주 좋습니다.","공부·자격증·실력 쌓기에 최적. 큰 도약을 준비하세요.","서두르지 말고 신뢰를 쌓으세요.","저축과 장기 투자에 좋습니다.","오늘 30분 공부하거나 책을 읽으세요."],
["頤","이","잘 기르기","산 아래 우레, 입처럼 먹고 기른다.","무엇을 먹고 무슨 말을 하는지가 중요한 때입니다. 몸과 마음에 좋은 것을 채우세요. 말을 조심하는 것도 나를 기르는 일입니다.","후배 양성과 자기 계발에 좋습니다. 말실수 주의.","함께 밥 먹는 시간이 관계를 키웁니다.","생활비와 식비를 점검하세요.","오늘 한 끼는 제대로 챙겨 드세요."],
["大過","대과","무거운 짐","대들보가 휘어질 만큼 무겁다.","감당하기 버거운 짐을 지고 있는 시기입니다. 혼자 다 지려 하지 말고 나누거나 줄이세요. 과감한 결단이 필요할 수 있어요.","업무 과부하. 우선순위를 정하고 도움을 요청하세요.","한쪽만 애쓰는 관계라면 균형을 찾으세요.","과도한 대출과 지출을 조심하세요.","할 일 중 하나를 과감히 빼거나 넘기세요."],
["坎","감","거듭된 험난","물이 겹겹이, 구덩이 속 구덩이.","어려움이 겹치는 시기입니다. 하지만 물이 멈추지 않고 흐르듯 꾸준히 원칙을 지키면 빠져나옵니다. 침착함이 가장 큰 무기예요.","위기 상황. 당황하지 말고 하나씩 처리하세요.","불안한 마음이 커지는 때. 믿음을 지키세요.","위험 신호입니다. 안전한 쪽을 택하세요.","걱정을 종이에 적고, 지금 할 수 있는 것만 하세요."],
["離","리","밝게 빛남","불이 겹쳐 환하게 비춘다.","열정과 밝음이 돋보이는 때입니다. 불이 장작에 붙어야 타듯, 좋은 사람과 좋은 원칙에 기대면 더 빛나요. 너무 타오르면 금방 꺼지니 주의하세요.","능력이 드러나는 때. 발표와 홍보에 좋습니다.","열정적이지만 감정 기복을 조심하세요.","지출이 쉽게 늘어나는 때. 충동구매 조심.","내가 잘하는 것 하나를 드러내 보세요."],
["咸","함","마음이 통함","산 위의 연못, 서로 느끼고 끌린다.","자연스러운 끌림과 공감이 생기는 때입니다. 억지로 하지 않아도 마음이 통해요. 열린 마음으로 받아들이세요.","사람과의 교감이 성과로 이어집니다.","연애운이 가장 좋은 괘 중 하나. 마음을 표현하세요.","사람을 통한 기회가 생길 수 있어요.","마음이 가는 사람에게 먼저 말을 걸어보세요."],
["恆","항","꾸준함","우레와 바람이 늘 함께하듯 변함없다.","오래 지속하는 것이 힘인 때입니다. 방향을 자주 바꾸지 말고 하던 일을 꾸준히 하세요. 변함없는 태도가 신뢰를 만듭니다.","루틴을 지키면 성과가 쌓입니다.","안정적인 관계. 익숙함 속의 성실함이 중요합니다.","적립식, 장기 저축에 좋습니다.","오늘도 하던 루틴을 빼먹지 마세요."],
["遯","둔","물러남","하늘 아래 산, 한 걸음 물러난다.","지금은 싸우거나 버티기보다 물러나는 게 지혜입니다. 도망이 아니라 힘을 지키는 후퇴예요. 거리를 두면 다시 기회가 옵니다.","갈등에서 빠지세요. 무리한 경쟁은 피하세요.","집착보다 한 발 물러나 여유를 두세요.","투자 비중을 줄이고 현금을 확보하세요.","오늘은 불편한 자리에서 일찍 일어나세요."],
["大壯","대장","강한 기세","하늘 위의 우레, 힘이 넘친다.","힘과 기세가 크게 오른 때입니다. 하지만 힘이 셀수록 바르게 써야 해요. 힘자랑은 뿔이 울타리에 걸리는 꼴이 됩니다.","추진력은 좋지만 밀어붙이기보다 원칙대로.","자신감은 좋지만 상대를 누르지 마세요.","상승세지만 과욕은 금물입니다.","오늘은 힘을 빼고 한 번 더 확인하세요."],
["晉","진","앞으로 나아감","해가 땅 위로 떠오른다.","실력이 인정받고 앞으로 나아가는 때입니다. 승진·발전·성장의 기운이 있어요. 밝고 바른 모습을 보여주세요.","승진, 인정, 좋은 평가의 기운.","관계가 진전됩니다. 밝게 다가가세요.","수입이 늘어나는 흐름입니다.","오늘 내 성과를 정리해 알리세요."],
["明夷","명이","빛을 감춤","해가 땅 밑으로 졌다.","능력을 알아주지 않거나 환경이 불리한 때입니다. 빛을 감추고 조용히 내실을 다지세요. 어둠은 지나가고 해는 다시 뜹니다.","튀지 말고 묵묵히. 불합리한 상황엔 조용히 대비하세요.","속마음을 다 드러내지 않는 게 나을 때입니다.","보수적으로. 숨은 위험에 주의하세요.","오늘은 말을 아끼고 내 할 일에 집중하세요."],
["家人","가인","집안을 바로 함","불에서 바람이 일듯, 안에서 밖으로.","가정과 가까운 관계를 돌볼 때입니다. 각자의 역할이 분명하면 집안이 편해요. 밖의 일도 안에서부터 정리하세요.","팀 내부 정비와 역할 분담에 좋습니다.","가족, 연인과의 시간이 중요합니다. 집에서의 태도를 돌아보세요.","가계부를 정리하고 가족 재정을 점검하세요.","가족에게 먼저 연락하거나 집안일 하나를 하세요."],
["睽","규","서로 어긋남","불은 위로, 연못은 아래로. 반대로 간다.","생각이 서로 엇갈리는 시기입니다. 큰일은 어렵지만 작은 일은 괜찮아요. 다름을 인정하면 오히려 서로를 보완합니다.","의견 차이가 있습니다. 작은 일부터 맞춰가세요.","오해가 생기기 쉬워요. 다름을 인정하세요.","공동 투자나 동업은 신중히.","의견이 다른 사람의 말을 끝까지 들어보세요."],
["蹇","건","가로막힌 길","산 위의 물, 앞길이 험하다.","앞으로 가기 힘든 장애물이 있습니다. 무리하게 넘으려 하지 말고 돌아가거나 도움을 구하세요. 나 자신을 돌아보는 계기로 삼으세요.","진행이 막힙니다. 방향을 바꾸거나 조력자를 찾으세요.","관계에 벽이 있어요. 서두르지 마세요.","무리한 투자는 하지 마세요.","막힌 일은 잠시 내려놓고 다른 길을 찾아보세요."],
["解","해","풀려남","우레와 비에 얼음이 녹는다.","꼬였던 일이 풀리는 때입니다. 풀렸으면 빨리 정리하고 일상으로 돌아오세요. 지난 잘못은 용서하고 넘어가면 좋습니다.","문제가 해결됩니다. 남은 일은 신속히 마무리하세요.","갈등이 풀리는 시기. 먼저 화해하세요.","막혔던 돈이 돌기 시작합니다.","누군가를, 혹은 나 자신을 용서하세요."],
["損","손","덜어냄","산 아래 연못, 아래를 덜어 위를 채운다.","줄이고 덜어내는 것이 이득이 되는 때입니다. 불필요한 것을 정리하면 오히려 좋아져요. 진심이 있다면 작은 것으로도 충분합니다.","일을 줄이고 핵심에 집중하세요.","내 욕심을 덜면 관계가 편해집니다.","지출 다이어트에 좋은 때. 무리한 투자는 손실로 이어질 수 있어요.","안 쓰는 물건이나 구독 하나를 정리하세요."],
["益","익","더해짐","바람과 우레가 서로 힘을 보탠다.","도움과 이익이 늘어나는 때입니다. 받은 만큼 베풀면 더 커져요. 좋은 점은 바로 배우고 고칠 점은 바로 고치세요.","성장과 확장에 좋은 때. 새 일을 시작해도 좋아요.","서로 힘이 되는 관계. 베풀수록 좋아집니다.","수익이 늘어나는 흐름입니다.","오늘 누군가에게 도움을 주세요."],
["夬","쾌","결단","연못이 하늘 위로 넘쳐 터진다.","결단을 내려야 할 때입니다. 미루던 문제를 분명하게 정리하세요. 감정으로 밀어붙이기보다 공개적이고 정정당당하게.","결정을 미루지 마세요. 투명하게 진행하세요.","애매한 관계는 정리하거나 확실히 하세요.","정리할 것은 과감하게 정리하세요.","미뤄온 결정 하나를 오늘 내리세요."],
["姤","구","뜻밖의 만남","하늘 아래 바람, 우연히 마주친다.","예상 못 한 만남이나 제안이 찾아옵니다. 반갑지만 너무 쉽게 빠져들지 마세요. 상대의 진짜 모습을 확인하세요.","새로운 제안이 옵니다. 조건을 꼼꼼히 확인하세요.","강한 끌림이 생길 수 있지만 신중하게.","달콤한 제안과 유혹을 조심하세요.","좋아 보이는 제안일수록 하루 생각하고 답하세요."],
["萃","췌","모여듦","땅 위의 연못, 물과 사람이 모인다.","사람과 자원이 모이는 때입니다. 모임·행사·협력에 좋아요. 모일 때는 중심과 목적이 분명해야 흩어지지 않습니다.","네트워킹, 회의, 모임에 좋은 때입니다.","모임에서 좋은 인연을 만날 수 있어요.","자금이 모이지만 관리가 중요합니다.","사람이 모이는 자리에 나가보세요."],
["升","승","조금씩 오름","땅 속의 나무가 위로 자란다.","꾸준히 오르는 상승의 때입니다. 나무가 자라듯 차근차근 올라가세요. 윗사람을 만나면 도움이 됩니다.","승진과 성장의 운. 꾸준함이 열쇠입니다.","관계가 천천히 깊어집니다.","점진적인 상승. 조급해하지 마세요.","목표를 향해 오늘 한 걸음만 나아가세요."],
["困","곤","곤궁함","연못에 물이 말랐다.","힘들고 지치는 시기입니다. 말해도 잘 믿어주지 않을 수 있으니 말보다 행동으로 보여주세요. 이런 때 버틴 사람이 나중에 크게 됩니다.","인정받기 어려운 때. 묵묵히 실력으로 보여주세요.","서운함이 커질 수 있어요. 말보다 행동으로.","자금 압박이 있습니다. 꼭 필요한 곳에만 쓰세요.","오늘 나를 위한 작은 휴식을 챙기세요."],
["井","정","마르지 않는 우물","두레박으로 우물물을 긷는다.","늘 그 자리에서 사람을 먹이는 우물처럼, 기본과 꾸준함이 중요한 때입니다. 실력은 있으니 잘 다듬고 나누세요. 마무리가 허술하면 두레박이 깨집니다.","기본기와 바탕을 정비하세요. 끝까지 마무리하세요.","변함없이 곁에 있어주는 것이 가장 큰 힘입니다.","안정적인 수입원을 잘 관리하세요.","내가 아는 것 하나를 누군가와 나누세요."],
["革","혁","바꿈","연못 속의 불, 낡은 것을 바꾼다.","변화가 필요한 때입니다. 낡은 방식은 바꿔야 해요. 충분히 무르익었을 때, 사람들의 공감을 얻고 바꾸면 성공합니다.","이직, 개편, 새로운 방식 도입을 고려할 때입니다.","관계의 방식을 바꿔볼 때. 이미지 변신도 좋아요.","돈 쓰는 구조를 바꿀 때. 계획한 뒤 실행하세요.","오래된 습관 하나를 바꿔보세요."],
["鼎","정","새로운 솥","나무 위의 불, 솥에서 음식이 익는다.","새로운 것이 자리 잡고 결실을 맺는 때입니다. 좋은 사람과 함께하면 큰일을 이룹니다. 안정과 신뢰가 바탕이에요.","새 체계가 자리를 잡습니다. 함께하는 사람을 아끼세요.","관계가 안정되고 깊어집니다.","안정된 기반 위에서 키워갈 때입니다.","함께 일하는 사람에게 맛있는 것을 대접하세요."],
["震","진","충격과 놀람","우레가 거듭 친다.","갑작스러운 일로 놀랄 수 있습니다. 하지만 놀란 뒤 침착하게 정신을 차리면 오히려 웃게 됩니다. 충격을 성장의 계기로 삼으세요.","갑작스러운 변화. 당황하지 말고 대응하세요.","예상치 못한 일이 관계를 흔들 수 있어요.","뜻밖의 지출에 대비하세요.","급한 소식이 와도 숨 한 번 쉬고 대응하세요."],
["艮","간","멈춤","산이 겹쳐 움직이지 않는다.","멈춰야 할 때입니다. 생각과 욕심을 멈추고 지금 자리에서 고요히 머무르세요. 멈출 줄 알면 실수하지 않습니다.","새로 벌이지 말고 지금 하는 일에 집중하세요.","서두르지 말고 잠시 멈춰 생각하세요.","투자도 소비도 잠시 멈추세요.","5분간 휴대폰을 내려놓고 조용히 있어보세요."],
["漸","점","차근차근","산 위의 나무가 천천히 자란다.","순서대로 천천히 나아가는 때입니다. 단계를 건너뛰지 마세요. 느리지만 확실하게 원하는 곳에 도착합니다.","단계별로 진행하면 성공합니다.","약속과 결혼 등 관계가 순서대로 발전합니다.","꾸준한 적립이 답입니다.","오늘 할 일을 순서대로 적고 차례대로 하세요."],
["歸妹","귀매","순서가 어긋남","연못 위의 우레, 감정이 앞선다.","감정이나 욕심이 앞서 순서가 뒤바뀌기 쉬운 때입니다. 내 위치와 상황을 분명히 알고 행동하세요. 무리하게 진행하면 끝이 좋지 않아요.","불리한 조건이나 애매한 위치. 무리한 추진은 금물.","감정에 휩쓸린 결정은 조심하세요.","충동적인 결정을 피하세요.","오늘은 감정으로 결정하지 마세요."],
["豐","풍","가장 풍성함","우레와 번개가 함께, 한낮의 태양.","가장 풍성하고 화려한 정점의 때입니다. 지금을 마음껏 누리되, 해는 중천에 오르면 기운다는 것을 기억하세요.","성과가 최고조. 이 기세로 마무리를 확실히.","관계가 무르익고 즐겁습니다.","수입이 많은 때. 미래를 위해 남겨두세요.","지금 가진 것을 적어보고 감사하세요."],
["旅","려","나그네","산 위의 불, 떠도는 여행자.","낯선 환경에 있거나 지금 자리가 잠시 머무는 곳인 때입니다. 나그네처럼 겸손하고 조심하면 무사합니다. 여행이나 이동이 생길 수 있어요.","이직·출장·파견 등 이동. 새 환경에서 예의를 지키세요.","짧은 만남이나 거리감. 깊은 약속은 신중히.","이동 비용이 들어요. 소지품을 잘 챙기세요.","새로운 곳에 가보거나 낯선 사람에게 친절하세요."],
["巽","손","스며듦","바람이 겹쳐 부드럽게 스민다.","부드럽게, 조금씩 스며드는 방식이 통하는 때입니다. 강하게 밀기보다 반복해서 설득하세요. 좋은 조언자를 따르면 이롭습니다.","협상과 설득은 부드럽고 끈기 있게.","천천히 다가가면 마음이 열립니다.","작은 수익이 꾸준히. 큰 판은 피하세요.","하고 싶은 말을 부드럽게 한 번 더 전해보세요."],

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function rand() {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }
  catch (e) { return Math.random(); }
}
function triIndex(bits) { return TRI.findIndex((t) => t.b.every((v, i) => v === bits[i])); }
function hexFromBits(bits) {
  const l = triIndex(bits.slice(0, 3)), u = triIndex(bits.slice(3, 6));
  return KW[u][l];
}
function bitsOf(n) { const p = POS[n]; return TRI[p.l].b.concat(TRI[p.u].b); }
function fullName(n) {
  const { u, l } = POS[n], d = D[n - 1];
  if (u === l) return { ko: "중" + TRI[u].x + d[1], hz: "重" + TRI[u].h + d[0] };
  const top = TRI[u].x === "뢰" ? "뇌" : TRI[u].x;
  return { ko: top + TRI[l].x + d[1], hz: TRI[u].h + TRI[l].h + d[0] };
}

// lines: array of {yang:bool, ch:bool, mk:string}; drawn bottom→top
function hexHTML(lines, size, fresh) {
  let h = '<div class="hex ' + (size || "") + '" aria-hidden="true">';
  lines.forEach((ln, i) => {
    if (!ln) { h += '<div class="ln yin empty"><i></i><i></i></div>'; return; }
    const cls = "ln " + (ln.yang ? "yang" : "yin") + (ln.ch ? " ch" : "") + (fresh && i === fresh - 1 ? " new" : "");
    h += '<div class="' + cls + '">' + (ln.yang ? "<i></i>" : "<i></i><i></i>") + (ln.mk ? '<span class="mk">' + ln.mk + "</span>" : "") + "</div>";
  });
  return h + "</div>";
}
function plainLines(n) { return bitsOf(n).map((b) => ({ yang: !!b })); }
function valLines(vals) { return vals.map((v) => ({ yang: v === 7 || v === 9, ch: v === 6 || v === 9, mk: v === 9 ? "○" : v === 6 ? "×" : "" })); }

function headHTML(n, linesHTML) {
  const d = D[n - 1], f = fullName(n), p = POS[n];
  return '<div class="headline">' + linesHTML +
    '<div><div class="num">제 ' + n + " 괘</div>" +
    '<h2 class="name">' + f.ko + '<span class="hz">' + f.hz + "</span></h2>" +
    '<span class="kw">' + d[2] + "</span>" +
    '<div class="tri">위 ' + TRI[p.u].s + " " + TRI[p.u].n + "(" + TRI[p.u].k + ") · 아래 " + TRI[p.l].s + " " + TRI[p.l].n + "(" + TRI[p.l].k + ")</div>" +
    "</div></div>";
}
function rowsHTML(n, skip) {
  const d = D[n - 1];
  return '<dl class="rows">' + [["work","일·공부"],["love","관계·연애"],["money","돈"]]
    .filter(([id]) => id !== skip)
    .map(([id, lb]) => '<div class="row"><dt>' + lb + "</dt><dd>" + d[CAT_IDX[id]] + "</dd></div>").join("") + "</dl>";
}
function yaoHTML(label, y, pos) {
  return '<div class="key"><b>' + label + '</b><div class="yt"><div><strong>' + y[1] + '</strong><span class="hz2">' + y[0] + "</span></div><p>" + y[2] + "</p>" +
    (pos ? '<span class="note">자리 · ' + pos + "</span>" : "") + "</div></div>";
}
function sixHTML(n) {
  return '<details><summary>여섯 효 보기</summary><div class="keys">' +
    Y[n - 1].map((y, i) => yaoHTML(LINE_POS[i][0], y, LINE_POS[i][1])).join("") +
    (YONG[n] ? yaoHTML(n === 1 ? "용구" : "용육", YONG[n], "여섯 효가 모두 변할 때") : "") + "</div></details>";
}
function detailHTML(n) {
  const d = D[n - 1];
  return '<div class="reading">' + headHTML(n, hexHTML(plainLines(n), "md")) +
    '<p class="one">' + d[3] + '</p><p class="easy">' + d[4] + "</p>" + rowsHTML(n) + sixHTML(n) +
    '<p class="tip"><strong>오늘 해볼 일</strong><span>' + d[8] + "</span></p>" +
    '<p class="note">도감의 괘는 변효가 없는 기본 모양입니다. 변효(빨간 효)는 엽전을 던져 얻은 괘에서만 나옵니다.</p></div>';
}

function ruleText(count, chIdx) {
  const top = chIdx.length ? LINE_POS[chIdx[chIdx.length - 1]][0] : "";
  if (count === 0) return "변하는 효가 없습니다. 지금 얻은 괘가 그대로 답입니다.";
  if (count === 1) return "변하는 효가 하나입니다. 본괘를 바탕으로 읽되, 변하는 자리(" + top + ")가 가장 중요한 힌트입니다.";
  if (count === 2) return "변하는 효가 둘입니다. 본괘를 중심으로 읽고, 위쪽 변효(" + top + ")에 더 무게를 두세요.";
  if (count === 3) return "변하는 효가 셋입니다. 본괘와 변괘를 반반씩, 지금과 앞으로를 함께 보세요.";
  if (count < 6) return "변하는 효가 많습니다. 상황이 이미 바뀌는 중이니 변괘 쪽이 더 중요한 답입니다.";
  return "모든 효가 변합니다. 지금과 반대 방향으로 크게 바뀌는 흐름이니 변괘를 답으로 보세요.";
}

function readingHTML(rec) {
  const vals = rec.v, cat = rec.c;
  const bits = vals.map((v) => (v === 7 || v === 9 ? 1 : 0));
  const nbits = vals.map((v) => (v === 9 ? 0 : v === 6 ? 1 : v === 7 ? 1 : 0));
  const n = hexFromBits(bits), m = hexFromBits(nbits), d = D[n - 1];
  const chIdx = vals.map((v, i) => (v === 6 || v === 9 ? i : -1)).filter((i) => i >= 0);
  const answerFrom = chIdx.length >= 4 ? m : n;
  const a = D[answerFrom - 1];
  let h = '<div class="reading">';
  const P = periodOf(rec.p);
  const catLabel = CATS.find((c) => c.id === cat).label;
  if (rec.q || P) h += '<p class="q">' + (rec.q ? esc(rec.q) : "질문 없이 본 괘") + '<span class="note">' + (P ? P.label + " · " : "") + catLabel + "</span></p>";
  h += headHTML(n, hexHTML(valLines(vals)));
  h += '<p class="one">' + d[3] + '</p><p class="easy">' + d[4] + "</p>";
  if (P) h += '<p class="frame">' + P.frame + "</p>";
  if (cat !== "all") {
    const lb = CATS.find((c) => c.id === cat).label;
    h += '<div class="answer"><span class="lb">' + lb + " · " + (answerFrom === n ? "지금의 답" : "앞으로의 답 (" + fullName(m).ko + ")") + "</span><p>" + a[CAT_IDX[cat]] + "</p></div>";
    h += "<details><summary>다른 분야도 보기</summary>" + rowsHTML(n, cat) + "</details>";
  } else {
    h += rowsHTML(n);
  }
  h += '<p class="tip"><strong>' + (P ? P.tip : "오늘 해볼 일") + "</strong><span>" + a[8] + "</span></p>";

  h += '<div class="sec"><h3>변화의 열쇠</h3><p class="rule">' + ruleText(chIdx.length, chIdx) + "</p>";
  if (chIdx.length) {
    const yong = chIdx.length === 6 && YONG[n];
    if (yong) h += '<p class="rule">' + (n === 1 ? "건괘" : "곤괘") + "에서 여섯 효가 모두 변하면 특별한 글(" + yong[0] + ")을 읽습니다.</p>";
    h += '<div class="keys">' + (yong ? yaoHTML(n === 1 ? "용구" : "용육", yong, "") : chIdx.map((i) => yaoHTML(LINE_POS[i][0], Y[n - 1][i], LINE_POS[i][1])).join("")) + "</div>";
    h += '<div class="flow"><div class="st"><small>지금</small>' + fullName(n).ko + " · " + d[2] + '</div><span class="arrow">→</span><div class="st"><small>앞으로' + (P ? " (" + P.ahead + ")" : "") + "</small>" + fullName(m).ko + " · " + D[m - 1][2] + "</div></div>";
    const md = D[m - 1];
    const mLines = nbits.map((b, i) => ({ yang: !!b, ch: chIdx.includes(i) }));
    h += '<div class="next">' + hexHTML(mLines, "md") + '<div><div class="num">변괘 · 제 ' + m + ' 괘</div><h3 class="name">' + fullName(m).ko + '<span class="hz">' + fullName(m).hz + "</span></h3><p>" + md[3] + "</p><p class=\"easy\">" + md[4] + "</p>" +
      (cat !== "all" ? "<p><span class=\"note\">" + CATS.find((c) => c.id === cat).label + "</span> " + md[CAT_IDX[cat]] + "</p>" : "") + "</div></div>";
  }
  h += "</div>";
  if (P) h += '<p class="note">' + P.again + "</p>";
  h += '<p class="note">' + new Date(rec.t).toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" }) + " · 효 값(아래→위) " + vals.join(" ") + "</p>";
  return h + "</div>";
}

function drawBuild(fresh) {
  const ls = [];
  for (let i = 0; i < 6; i++) ls.push(cur[i] ? valLines([cur[i]])[0] : null);
  $("#build").outerHTML = hexHTML(ls, "", fresh).replace('class="hex', 'id="build" class="hex');
  $("#buildLabel").textContent = cur.length + " / 6 효";
  $("#tossBtn").textContent = cur.length < 6 ? "엽전 던지기 · " + (cur.length + 1) + "/6" : "괘가 나왔습니다";
  $("#tossBtn").disabled = cur.length >= 6;
  $("#quickBtn").hidden = cur.length >= 6;
  $("#resetBtn").hidden = cur.length === 0;
}

function tossOnce() {
  return new Promise((done) => {
    const faces = [0,0,0].map(() => rand() < 0.5);
    const v = faces.reduce((s, f) => s + (f ? 3 : 2), 0);
    const coins = document.querySelectorAll("#coins .coin");
    coins.forEach((c) => c.classList.add("flip"));
    setTimeout(() => {
      coins.forEach((c, i) => { c.classList.remove("flip"); c.classList.toggle("back", !faces[i]); });
      cur.push(v);
      const chg = v === 6 || v === 9;
      $("#readout").innerHTML = LINE_POS[cur.length - 1][0] + " · " + faces.map((f) => (f ? "앞" : "뒤")).join(" ") + " = <b>" + v + "</b> " + '<span class="' + (chg ? "chg" : "") + '">' + NAMES[v] + "</span>";
      drawBuild(cur.length);
      done();
    }, reduced ? 0 : 460);
  });
}

async function toss(times) {
  if (busy) return; busy = true;
  for (let i = 0; i < times && cur.length < 6; i++) {
    await tossOnce();
    if (times > 1 && !reduced) await new Promise((r) => setTimeout(r, 140));
  }
  busy = false;
  if (cur.length === 6) finish();
}
function finish() {
  const rec = { t: Date.now(), q: $("#q").value.trim(), c: cat, p: period, v: cur.slice() };
  hist.unshift(rec); saveHist(hist); drawHist();
  $("#result").innerHTML = readingHTML(rec);
  $("#result").scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" });
}
function reset() {
  cur = []; $("#result").innerHTML = "";
  $("#readout").textContent = "질문을 마음에 품고 엽전을 던지세요. 아래 효부터 위로 쌓입니다.";
  document.querySelectorAll("#coins .coin").forEach((c) => c.classList.remove("back"));
  drawBuild();
}
$("#tossBtn").addEventListener("click", () => toss(1));
$("#quickBtn").addEventListener("click", () => toss(6));
$("#resetBtn").addEventListener("click", () => { reset(); $("#q").focus(); });

/* ---------- 64 grid ---------- */
function drawGrid(filter) {
  const f = (filter || "").trim();
  const items = [];
  for (let n = 1; n <= 64; n++) {
    const d = D[n - 1], fn = fullName(n);
    const hay = [n, d[0], d[1], d[2], d[3], fn.ko, fn.hz].join(" ");
    if (f && !hay.includes(f)) continue;
    items.push('<button class="card" data-n="' + n + '">' + hexHTML(plainLines(n), "sm") +
      '<div><div class="n">' + n + '</div><div class="nm">' + fn.ko + '</div><div class="k">' + d[2] + "</div></div></button>");
  }
  $("#grid").innerHTML = items.join("") || '<p class="empty-msg">"' + esc(f) + '"에 맞는 괘가 없습니다. 이름(예: 태)이나 뜻(예: 기다림)으로 찾아보세요.</p>';
}
$("#search").addEventListener("input", (e) => drawGrid(e.target.value));
$("#grid").addEventListener("click", (e) => { const b = e.target.closest("[data-n]"); if (b) openOv(detailHTML(+b.dataset.n)); });

/* ---------- hist ---------- */
function drawHist() {
  if (!hist.length) {
    $("#hist").innerHTML = '<p class="empty-msg">아직 기록이 없습니다. 괘 보기에서 엽전을 던지면 이곳에 자동으로 남습니다. 기록은 이 브라우저에만 저장됩니다.</p>';
    return;
  }
  $("#hist").innerHTML = hist.map((r, i) => {
    const bits = r.v.map((v) => (v === 7 || v === 9 ? 1 : 0));
    const nb = r.v.map((v) => (v === 9 ? 0 : v === 6 ? 1 : v === 7 ? 1 : 0));
    const n = hexFromBits(bits), m = hexFromBits(nb);
    const t = new Date(r.t).toLocaleDateString("ko-KR", { month: "short", day: "numeric" });
    return '<button class="hrow" data-i="' + i + '">' + hexHTML(valLines(r.v), "sm") +
      '<div><div class="t">' + t + " · " + (periodOf(r.p) ? periodOf(r.p).label + " · " : "") + CATS.find((c) => c.id === r.c).label + '</div><div class="qq">' + (r.q ? esc(r.q) : "질문 없이 본 괘") + "</div></div>" +
      '<span class="g">' + fullName(n).ko + (n !== m ? " → " + fullName(m).ko : "") + "</span></button>";
  }).join("") + '<div class="actions"><button class="btn ghost" id="clearHist">기록 모두 지우기</button><span class="note" id="clearMsg"></span></div>';
}
let clearArmed = false;
$("#hist").addEventListener("click", (e) => {
  if (e.target.id === "clearHist") {
    if (!clearArmed) { clearArmed = true; e.target.textContent = "한 번 더 누르면 지워집니다"; return; }
    hist = []; saveHist(hist); clearArmed = false; drawHist(); return;
  }
  const b = e.target.closest("[data-i]"); if (b) openOv(readingHTML(hist[+b.dataset.i]));
});

/* ---------- overlay ---------- */
let lastFocus = null;
function openOv(html) { lastFocus = document.activeElement; $("#ovBody").innerHTML = html; $("#ov").hidden = false; $("#closeOv").focus(); }
function closeOv() { $("#ov").hidden = true; if (lastFocus) lastFocus.focus(); }
$("#closeOv").addEventListener("click", closeOv);
$("#ov").addEventListener("click", (e) => { if (e.target.id === "ov") closeOv(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#ov").hidden) closeOv(); });

/* ---------- tabs ---------- */
function showTab(t) {
  ["ask","all","hist"].forEach((x) => {
    $("#view-" + x).hidden = x !== t;
    $("#tab-" + x).setAttribute("aria-selected", x === t);
  });
}
document.querySelector("nav").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab); });
if (location.hash === "#gwae") showTab("all");
if (location.hash === "#hist") showTab("hist");

/* ---------- keep the open reading when the app is updated ---------- */
function start(data) {
  data = data || {};
  if (Array.isArray(data.cur)) cur = data.cur.slice(0, 6);
  if (data.cat && CAT_IDX[data.cat] !== undefined || data.cat === "all") {
    cat = data.cat;
    document.querySelectorAll("#cats .chip").forEach((x) => x.setAttribute("aria-pressed", x.dataset.c === cat));
  }
  if (typeof data.q === "string") $("#q").value = data.q;
  if (periodOf(data.period)) setPeriod(data.period);
  drawBuild(); drawGrid(""); drawHist();
  if (cur.length === 6 && data.rec) $("#result").innerHTML = readingHTML(data.rec);
  if (data.tab) showTab(data.tab);
}
window.claude?.hot?.snapshot?.(() => ({
  cur, cat, period, q: $("#q").value, rec: cur.length === 6 ? hist[0] : null,
  tab: ["ask","all","hist"].find((x) => !$("#view-" + x).hidden),
}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
